name: FlowLens verification
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md', 'CHANGELOG.md', 'evidence/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flowlens-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/verify.py --browser --output evidence/ci-local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-verification
          path: evidence/ci-local/
          retention-days: 7
  live-github-and-zip:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - name: Real GitHub URL and same-commit ZIP
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/verify.py --live https://github.com/Dowon-Kang/vibecare-pilot --output evidence/ci-live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-github-zip-verification
          path: evidence/ci-live/
          retention-days: 7

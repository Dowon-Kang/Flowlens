name: Cycle 03 apply and verify
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cycle-03.yml', 'scripts/apply_cycle03.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-commit:
    if: github.repository == 'Dowon-Kang/Flowlens' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply checksum-guarded reviewed corrections
        run: python scripts/apply_cycle03.py
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Unit, actual HTTP browser, real GitHub and same-commit ZIP
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/verify.py --browser --live https://github.com/Dowon-Kang/vibecare-pilot --output evidence/cycle-03-ci
      - name: Commit only verified source without force push
        run: |
          git add app scripts/browser_smoke.py
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: verified v0.2.1 parser, ZIP and browser corrections'
          git push origin HEAD:main
      - name: Preserve actual execution logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycle-03-verification
          path: evidence/cycle-03-ci/
          retention-days: 7

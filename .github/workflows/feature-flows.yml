name: Feature flow acceptance
on:
  push:
    branches: [main, feat/evidence-scoped-flows]
    paths-ignore: ['docs/**', 'README.md', 'CHANGELOG.md', 'evidence/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Capture actual public source as data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/capture_reference.py --output evidence/acceptance-ci/snapshot.json
      - name: Meaning-level acceptance
        run: python scripts/acceptance_flow.py --snapshot evidence/acceptance-ci/snapshot.json --output evidence/acceptance-ci/semantic
      - name: Actual browser upload and drill-down
        run: |
          python run.py > evidence/acceptance-ci/server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          python - <<'PY'
          import time,httpx
          for _ in range(30):
              try:
                  if httpx.get('http://127.0.0.1:8000/api/health',trust_env=False).status_code==200:break
              except httpx.HTTPError:pass
              time.sleep(0.2)
          else:raise SystemExit('Server failed to start')
          PY
          python scripts/process_browser.py --snapshot evidence/acceptance-ci/snapshot.json --output evidence/acceptance-ci/browser
          python scripts/build_review_demo.py evidence/acceptance-ci/semantic/analysis.json evidence/acceptance-ci/FlowLens_Demo.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feature-flow-acceptance
          path: evidence/acceptance-ci/
          retention-days: 7
